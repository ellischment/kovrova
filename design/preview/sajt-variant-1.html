:root{color-scheme:light;--bar:#3D4E21;--bar-ink:#F2DCB9;--bar-ink2:#D9C9A8;--sheet:#F6E7D2;--ink:#1E2113;--ink2:#4C4A3A;--line:#CDB894;--focus:#7E1F2A;
  font-family:Geologica,system-ui,-apple-system,'Segoe UI',sans-serif}
html,body{height:100%}
body{margin:0;background:var(--sheet);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}

.bar{display:flex;align-items:center;gap:6px;padding:4px max(8px,1vw);padding-top:calc(4px + env(safe-area-inset-top,0px));background:var(--bar);color:var(--bar-ink);font-size:13px;min-height:36px;flex:none}
.bar b{font-weight:600;white-space:nowrap}

.bar button{min-height:32px;padding:0 12px;border-radius:6px;border:1.5px solid var(--bar-ink);background:transparent;color:var(--bar-ink);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
.bar button.on{background:var(--bar-ink);color:var(--ink)}
.bar button:disabled{opacity:.4;cursor:default}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.stage iframe{border:0;width:100%;height:100%;display:block;background:#E4D3BA}
.all{position:absolute;inset:0;overflow:auto;background:var(--sheet);padding:20px max(16px,4vw) 48px}

.all h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:500;margin:0 0 8px}
.all ul{list-style:none;margin:0;padding:0;columns:3 220px;column-gap:24px}
.all li{break-inside:avoid;padding:3px 0}
.all a{color:var(--ink);font-size:15px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.all a[aria-current]{font-weight:650;text-decoration-color:var(--ink)}
@media (max-width:640px){.bar .t,.bar b{display:none}.bar{gap:4px}.bar button{padding:0 9px}#allbtn{margin-left:auto}.lg{display:none}}

otchety', title: 'Отчёты', href: 'otchety.html' },\n    { id: 'nastrojki', title: 'Настройки', href: 'nastrojki.html' },\n  ];\n\n  function mountNav(active) {\n    var root = document.getElementById('tabs-root');\n    if (!root) return;\n    var isMoreActive = MORE.some(function (m) { return m.id === active; });\n    root.innerHTML = '<nav class=\"tabs\" role=\"tablist\" aria-label=\"Разделы кабинета\">' +\n      NAV.map(function (n) {\n        if (n.id === 'more') return '<button role=\"tab\" id=\"moreBtn\" aria-selected=\"' + isMoreActive + '\" aria-haspopup=\"true\" aria-expanded=\"false\">' + n.title + '<\/button>';\n        return '<a role=\"tab\" href=\"' + n.href + '\" aria-current=\"' + (n.id === active ? 'page' : 'false') + '\">' + n.title + '<\/a>';\n      }).join('') + '<\/nav>' +\n      '<div class=\"more-menu\" id=\"moreMenu\" hidden>' + MORE.map(function (m) {\n        return '<a href=\"' + m.href + '\"' + (m.id === active ? ' aria-current=\"page\"' : '') + '>' + m.title + '<\/a>';\n      }).join('') + '<\/div>';\n    var moreBtn = document.getElementById('moreBtn'), moreMenu = document.getElementById('moreMenu');\n    if (moreBtn) {\n      moreBtn.addEventListener('click', function () {\n        var open = moreMenu.hidden;\n        moreMenu.hidden = !open;\n        moreBtn.setAttribute('aria-expanded', String(open));\n        if (open) { var first = moreMenu.querySelector('a'); if (first) first.focus(); }\n      });\n      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !moreMenu.hidden) { moreMenu.hidden = true; moreBtn.setAttribute('aria-expanded', 'false'); moreBtn.focus(); } });\n      document.addEventListener('click', function (e) { if (!moreMenu.hidden && !moreMenu.contains(e.target) && e.target !== moreBtn) { moreMenu.hidden = true; moreBtn.setAttribute('aria-expanded', 'false'); } });\n    }\n  }\n\n  /* демо-данные: расписание месяца по датам (использует ту же hash-логику, что и booking) */\n  function monthSchedule(year, month) {\n    var days = new Date(year, month + 1, 0).getDate();\n    var out = [];\n    for (var d = 1; d <= days; d++) { var iso = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0'); out.push({ day: d, iso: iso, loc: K.dayLocation(iso) }); }\n    return out;\n  }\n\n  var GUESTS = [\n    { name: 'Анна', phone: '+7 916 000-11-22', visits: 5, regular: true, lastVisit: 'массаж 90 · лимфодренажный', consent: { pdn: true, marketing: true, rasprostranenie: false } },\n    { name: 'Мария', phone: '+7 916 222-33-44', visits: 1, regular: false, lastVisit: 'первичный приём', consent: { pdn: true, marketing: false, rasprostranenie: false } },\n    { name: 'Ольга', phone: '+7 916 333-44-55', visits: 2, regular: false, lastVisit: 'остеопрактика', consent: { pdn: true, marketing: true, rasprostranenie: true } },\n    { name: 'Елена', phone: '+7 916 444-55-66', visits: 8, regular: true, lastVisit: 'массаж 90 · стоун-массаж', consent: { pdn: true, marketing: true, rasprostranenie: true } },\n  ];\n\n  var WAITLIST = [\n    { name: 'Елена', tag: 'reg', loc: 'lesnoe', svc: 'Массаж 90', windows: 'выходные утром', horizon: '31 окт.', position: 1 },\n    { name: 'Дарья', tag: 'new', loc: 'lesnoe', svc: 'Первичный приём', windows: 'будни вечером', horizon: '15 окт.', position: 1 },\n    { name: 'Ксения', tag: '', loc: 'moskva', svc: 'Остеопрактика', windows: 'любые дни', horizon: '30 нояб.', position: 2 },\n  ];\n\n  global.KVRA = { mountNav: mountNav, monthSchedule: monthSchedule, GUESTS: GUESTS, WAITLIST: WAITLIST };\n})(window);\n"}, "design/directions/c/admin.css": {"m": "text/css", "t": "/* Направление C · Календарь — кабинет Ирины (мобайл), pages/admin/*.html */\n\n@font-face{font-family:\"Geologica\";font-style:normal;font-display:swap;font-weight:100 900;\n  src:url({{a:design/directions/c/fonts/geologica-cyrillic-wght-normal.woff2}}) format(\"woff2-variations\"),url({{a:design/directions/c/fonts/geologica-cyrillic-wght-normal.woff2}}) format(\"woff2\");\n  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}\n@font-face{font-family:\"Geologica\";font-style:normal;font-display:swap;font-weight:100 900;\n  src:url({{a:design/directions/c/fonts/geologica-latin-wght-normal.woff2}}) format(\"woff2-variations\"),url({{a:design/directions/c/fonts/geologica-latin-wght-normal.woff2}}) format(\"woff2\");\n  unicode-range:U+0000-00FF,U+2000-206F}\n@font-face{font-family:\"Marck Script\";font-style:normal;font-display:swap;font-weight:400;\n  src:url({{a:design/directions/c/fonts/marck-script-cyrillic-400-normal.woff2}}) format(\"woff2\");\n  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}\n@font-face{font-family:\"Marck Script\";font-style:normal;font-display:swap;font-weight:400;\n  src:url({{a:design/directions/c/fonts/marck-script-latin-400-normal.woff2}}) format(\"woff2\");\n  unicode-range:U+0000-00FF,U+2000-206F}\n\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg-alt);color:var(--text);font:400 15px/1.5 var(--font-sans);min-height:100dvh}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}\n.q{font-size:11px;font-weight:700;color:var(--bordo-500,#7E1F2A);background:var(--sand-200);border-radius:6px;padding:1px 6px;vertical-align:1px}\nh2{font:600 18px/1.3 var(--font-sans);margin:18px 0 10px}\n.phone{max-width:430px;min-height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column}\nheader.a-head{padding:12px 16px 10px;border-bottom:2px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}\nheader.a-head .t{font:600 19px/1.2 var(--font-sans)}\nheader.a-head .s{font-size:12px;color:var(--text-muted)}\nmain{flex:1;padding:14px 16px 96px}\n.card{background:var(--sheet-bg);color:var(--sheet-text);border:var(--frame) solid var(--sheet-line);border-radius:var(--radius-frame);padding:14px;margin-bottom:10px}\n/* весь контент кабинета лежит на кремовых карточках — сильнее правила base.css \"body .muted\" */\n.card .muted,.card.muted,.card .small.muted{color:var(--sheet-muted)}\n.row{display:flex;gap:12px;align-items:flex-start}\n.time{font-weight:700;min-width:52px}\n.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:4px;vertical-align:1px}\n.tag.new{background:transparent;border:1.5px solid var(--loc-moskva-fill);color:var(--sheet-text)}\n.tag.reg{border:1.5px solid var(--loc-lesnoe);color:var(--sheet-text)}\n.muted{color:var(--sheet-muted)}\n.small{font-size:13px}\n.free{border-style:dashed}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);padding:0 16px;border-radius:var(--radius-btn);border:2px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-text);font:600 14px/1 var(--font-sans);cursor:pointer}\n.btn.sec{background:transparent;color:var(--text);border-color:var(--line)}\n.card .btn.sec{color:var(--sheet-text);border-color:var(--sheet-line)}\n.card .btn.sec[disabled]{color:var(--sheet-muted)}\n.btn.sm{min-height:38px;padding:0 12px;font-size:13px}\n.btn.block{width:100%}\n.btn[disabled]{opacity:.4;cursor:not-allowed}\n.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}\ntable{width:100%;min-width:330px;border-collapse:collapse;font-size:13px;background:var(--sheet-bg);color:var(--sheet-text);border:var(--frame) solid var(--sheet-line);border-radius:var(--radius-frame);overflow:hidden}\nth,td{padding:9px 6px;border-bottom:1px solid var(--sheet-line);text-align:left;vertical-align:middle;color:var(--sheet-text)}\ntd .muted,td .small.muted{color:var(--sheet-muted)}\nth{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--sheet-muted);font-weight:700;background:var(--bg-alt)}\ntd input{width:64px;min-height:38px;border:2px solid var(--sheet-line);border-radius:8px;padding:4px 6px;font:600 14px var(--font-sans);color:var(--sheet-text);background:#fff}\ntd input:focus{outline:none;border-color:var(--accent-field)}\ntd.off input{opacity:.35}\n.sw{display:block;font-size:11px;color:var(--sheet-muted);margin-top:4px;cursor:pointer;background:none;border:0;padding:0;font-family:inherit}\n.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6;overflow-x:auto}\n.tabs a,.tabs button{border:0;background:none;padding:9px 2px 10px;font:600 11px var(--font-sans);color:var(--text-muted);cursor:pointer;min-height:52px;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px}\n.tabs a[aria-current=page],.tabs button[aria-selected=true]{color:var(--text);box-shadow:inset 0 3px 0 var(--pick)}\n.more-menu{position:fixed;left:8px;right:8px;bottom:64px;max-width:414px;margin:0 auto;background:var(--sheet-bg);color:var(--sheet-text);border-radius:var(--radius-frame);border:var(--frame) solid var(--sheet-line);padding:8px;z-index:7;display:grid;gap:4px}\n.more-menu a{display:block;padding:12px 10px;border-radius:8px;color:inherit;text-decoration:none;font-weight:600;font-size:14px}\n.more-menu a:hover{background:var(--bg-alt)}\n.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink-900);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}\n.toast.show{opacity:1}\n.note{font-size:12px;color:var(--text-muted);margin-top:8px}\n[hidden]{display:none!important}\n\n/* календарь месяца в кабинете */\n.cal-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}\n.cal-head .m{font-family:var(--font-hand);font-size:26px}\n.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:10px;color:var(--text-muted);text-align:center;margin-bottom:4px;text-transform:uppercase}\n.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}\n.cal-day{position:relative;aspect-ratio:1/1;border-radius:8px;border:2px solid var(--line);background:var(--sheet-bg);color:var(--sheet-text);font:600 13px/1 var(--font-sans);display:flex;align-items:center;justify-content:center;cursor:pointer}\n.cal-day.empty{visibility:hidden}\n.cal-day.lesnoe{border-color:var(--loc-lesnoe)}\n.cal-day.moskva{background:var(--loc-moskva-fill);color:var(--loc-moskva-text);border-color:var(--loc-moskva-fill)}\n.cal-day.closed{opacity:.4}\n.cal-day[aria-pressed=true]{outline:3px solid var(--focus);outline-offset:1px}\n.cal-day.is-today{box-shadow:inset 0 0 0 2px var(--ink-900)}\n.cal-day.is-today::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:currentColor}\n.cal-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text-muted);margin:8px 0}\n.cal-legend span{display:inline-flex;align-items:center;gap:6px}\n.cal-legend i{width:12px;height:12px;border-radius:4px;border:2px solid var(--loc-lesnoe);display:inline-block;background:var(--sheet-bg)}\n.cal-legend i.moskva{background:var(--loc-moskva-fill);border-color:var(--loc-moskva-fill)}\n\n.field{margin-bottom:12px}\n.field label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}\n.field input,.field select,.field textarea{width:100%;min-height:44px;border:2px solid var(--line);border-radius:10px;background:var(--sheet-bg);color:var(--sheet-text);padding:10px 12px;font:400 15px/1.4 var(--font-sans)}\n.chip{display:inline-flex;min-height:38px;align-items:center;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:transparent;font:600 13px var(--font-sans);color:var(--text);cursor:pointer;margin:2px}\n.chip[aria-pressed=true]{background:var(--pick);border-color:var(--pick);color:var(--pick-ink)}\n.card .chip{color:var(--sheet-text);border-color:var(--sheet-line)}\n.card .chip[aria-pressed=true]{color:var(--pick-ink);border-color:var(--pick)}\n"}, "design/directions/c/app.js": {"m": "text/javascript", "t": "// Направление C · общий JS: меню, тема, фильтры прайса, подбор.\n// Ванильный JS, без внешних запросов и без Google/Meta-сервисов.\n(function () {\n  \"use strict\";\n\n  // --- мобильное меню ---\n  var toggle = document.getElementById(\"nav-toggle\");\n  var panel = document.getElementById(\"site-nav-panel\");\n  if (toggle && panel) {\n    toggle.addEventListener(\"click\", function () {\n      var open = panel.classList.toggle(\"is-open\");\n      toggle.setAttribute(\"aria-expanded\", String(open));\n    });\n  }\n\n  // --- тема (moss / night / cream), сохраняется в localStorage ---\n  var root = document.documentElement;\n  var THEME_KEY = \"kovrova-theme\";\n  function applyTheme(theme) {\n    if (theme === \"moss\") {\n      root.removeAttribute(\"data-theme\");\n      root.setAttribute(\"data-theme\", \"moss\");\n    } else {\n      root.setAttribute(\"data-theme\", theme);\n    }\n    document.querySelectorAll(\"[data-theme-btn]\").forEach(function (btn) {\n      btn.setAttribute(\"aria-pressed\", String(btn.dataset.themeBtn === theme));\n    });\n  }\n  try {\n    var saved = localStorage.getItem(THEME_KEY);\n    if (saved) applyTheme(saved);\n  } catch (e) {}\n  document.querySelectorAll(\"[data-theme-btn]\").forEach(function (btn) {\n    btn.addEventListener(\"click\", function () {\n      var theme = btn.dataset.themeBtn;\n      applyTheme(theme);\n      try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}\n    });\n  });\n\n  // --- прайс: поиск + фильтры ---\n  var searchInput = document.getElementById(\"price-search\");\n  var table = document.getElementById(\"price-table\");\n  var chips = document.querySelectorAll(\".filter-chip\");\n  var locButtons = document.querySelectorAll(\"[data-loc-switch] button\");\n\n  function currentLoc() {\n    var pressed = document.querySelector(\"[data-loc-switch] button[aria-pressed='true']\");\n    return pressed ? pressed.dataset.loc : \"all\";\n  }\n  function activeFilters() {\n    var active = [];\n    chips.forEach(function (c) {\n      if (c.getAttribute(\"aria-pressed\") === \"true\") active.push(c.dataset.filter);\n    });\n    return active;\n  }\n  function applyFilters() {\n    if (!table) return;\n    var q = (searchInput && searchInput.value || \"\").trim().toLowerCase();\n    var loc = currentLoc();\n    var filters = activeFilters();\n    var rows = table.querySelectorAll(\"tbody tr\");\n    var visibleCount = 0;\n    rows.forEach(function (row) {\n      if (!row.dataset.title) return;\n      var text = row.dataset.title.toLowerCase();\n      var rowLoc = row.dataset.loc;\n      var rowTags = (row.dataset.tags || \"\").split(\" \");\n      var matchesQuery = !q || text.indexOf(q) !== -1;\n      var matchesLoc = loc === \"all\" || rowLoc === loc || rowLoc === \"online-any\" || rowLoc === \"any\";\n      var matchesFilters = filters.every(function (f) { return rowTags.indexOf(f) !== -1; });\n      var show = matchesQuery && matchesLoc && matchesFilters;\n      row.hidden = !show;\n      if (show) visibleCount++;\n    });\n    var emptyRow = document.getElementById(\"price-empty\");\n    if (emptyRow) emptyRow.hidden = visibleCount !== 0;\n  }\n  if (searchInput) searchInput.addEventListener(\"input\", applyFilters);\n  chips.forEach(function (c) {\n    c.addEventListener(\"click\", function () {\n      c.setAttribute(\"aria-pressed\", c.getAttribute(\"aria-pressed\") === \"true\" ? \"false\" : \"true\");\n      applyFilters();\n    });\n  });\n  locButtons.forEach(function (b) {\n    b.addEventListener(\"click\", function () {\n      locButtons.forEach(function (x) { x.setAttribute(\"aria-pressed\", \"false\"); });\n      b.setAttribute(\"aria-pressed\", \"true\");\n      applyFilters();\n    });\n  });\n  if (table) applyFilters();\n\n  // --- подбор «Не знаю, что выбрать» ---\n  var podborForm = document.getElementById(\"podbor-form\");\n  if (podborForm) {\n    var result = document.getElementById(\"podbor-result\");\n    var MAP = {\n      \"napryazhenie-lesnoe\": \"Классический массаж или лимфодренажный массаж (Пригород Лесное), 90&nbsp;минут.\",\n      \"napryazhenie-online\": \"Сессия психосоматики онлайн — работа с телом через разговор и практики.\",\n      \"otdyh-lesnoe\": \"Стоун-массаж (Пригород Лесное) — тёплые камни, глубокое расслабление.\",\n      \"emocii-online\": \"Консультация с метафорическими картами онлайн или сессия психосоматики.\",\n      \"emocii-lesnoe\": \"Сессия психосоматики очно, Пригород Лесное.\",\n      \"lico-lesnoe\": \"Массаж лица и шейно-воротниковой зоны, 45&nbsp;минут.\",\n      \"vpervye-lesnoe\": \"Первичный приём очно — знакомство, точка А, начало работы.\",\n      \"vpervye-online\": \"Первичный приём онлайн — знакомство и проверка связи заранее.\"\n    };\n    podborForm.addEventListener(\"submit\", function (e) {\n      e.preventDefault();\n      var data = new FormData(podborForm);\n      var key = (data.get(\"zapros\") || \"\") + \"-\" + (data.get(\"mesto\") || \"\");\n      result.hidden = false;\n      result.querySelector(\"[data-podbor-text]\").textContent =\n        MAP[key] || \"Похоже, ваш запрос особый — напишите Ирине, и она подберёт вариант лично.\";\n      result.scrollIntoView({ behavior: window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches ? \"auto\" : \"smooth\", block: \"start\" });\n    });\n  }\n})();\n"}, "design/directions/c/base.css": {"m": "text/css", "t": "/* Направление C · Календарь — общие стили и компоненты публичного сайта.\n   Владелец файла: designer. Токены — tokens.css (primitive → semantic).\n   Здесь: component-слой (без «магических» цветов — только var(--...)). */\n\n@import url(\"{{a:design/directions/c/tokens.css}}\");\n\n@font-face {\n  font-family: \"Geologica\";\n  src: url(\"{{a:design/direction   };\n})(window);\n"}, "design/directions/c/booking.css": {"m": "text/css", "t": "/* Направление C · Календарь — лист записи и гостевые страницы (booking/*).\n   Подключается после tokens.css и base.css. Даёт самостоятельный, приличный вид,\n   даже если base.css ещё не готов: содержит минимальный reset и типографику. */\n\n/* --- fallback @font-face на случай, если base.css ещё не подключает шрифты --- */\n@font-face{font-family:\"Geologica\";font-style:normal;font-display:swap;font-weight:100 900;\n  src:url({{a:design/directions/c/fonts/geologica-cyrillic-wght-normal.woff2}}) format(\"woff2-variations\"),url({{a:design/directions/c/fonts/geologica-cyrillic-wght-normal.woff2}}) format(\"woff2\");\n  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}\n@font-face{font-family:\"Geologica\";font-style:normal;font-display:swap;font-weight:100 900;\n  src:url({{a:design/directions/c/fonts/geologica-latin-wght-normal.woff2}}) format(\"woff2-variations\"),url({{a:design/directions/c/fonts/geologica-latin-wght-normal.woff2}}) format(\"woff2\");\n  unicode-range:U+0000-00FF,U+2000-206F}\n@font-face{font-family:\"Marck Script\";font-style:normal;font-display:swap;font-weight:400;\n  src:url({{a:design/directions/c/fonts/marck-script-cyrillic-400-normal.woff2}}) format(\"woff2\");\n  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}\n@font-face{font-family:\"Marck Script\";font-style:normal;font-display:swap;font-weight:400;\n  src:url({{a:design/directions/c/fonts/marck-script-latin-400-normal.woff2}}) format(\"woff2\");\n  unicode-range:U+0000-00FF,U+2000-206F}\n\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}\nbody{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 var(--font-sans);min-height:100dvh}\nimg{max-width:100%;display:block}\nh1,h2,h3{font-family:var(--font-sans);font-weight:600;line-height:1.2;margin:0 0 .4em}\np{margin:0 0 1em}\na{color:inherit}\nbutton{font-family:inherit}\n:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}\n.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}\n.q{font-size:11px;font-weight:700;color:var(--bordo-500,#7E1F2A);background:var(--sand-200);border-radius:6px;padding:1px 6px;vertical-align:1px;white-space:nowrap}\n\n/* ---- заметка о прототипе ---- */\n.proto-note{background:var(--bg-alt);color:var(--text);font-size:13px;line-height:1.4;text-align:center;padding:6px 14px}\n.proto-note b{color:var(--focus)}\n\n/* ---- страничная рамка (mobile-first, max 480 на десктопе для листа записи) ---- */\n.page{max-width:560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}\n.page-wide{max-width:820px;height:auto;min-height:100dvh;overflow:visible}\n\n/* ---- шапка листа записи ---- */\n.bk-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;padding:8px 6px;background:var(--bg);border-bottom:2px solid var(--line)}\n.bk-head h1{flex:1;text-align:center;font-size:17px;margin:0}\n.icon-btn{width:44px;height:44px;min-width:44px;border:0;background:transparent;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer}\n.icon-btn:hover{background:var(--bg-alt)}\n.icon-btn[hidden]{visibility:hidden}\n.progress{height:3px;background:var(--line)}\n.progress i{display:block;height:100%;background:var(--pick);transition:width 220ms ease}\n\n/* ---- тело шага ---- */\n.bk-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 24px}\n.step-kicker{font-size:13px;color:var(--text-muted);margin-bottom:10px}\n.bk-foot{padding:12px 16px 12px;border-top:2px solid var(--line);background:var(--bg);flex:none}\n.bk-legal{flex:none;margin:0;padding:6px 16px calc(6px + env(safe-area-inset-bottom));font-size:11px;line-height:1.4;color:var(--muted);text-align:center;background:var(--bg)}\n.page-wide .bk-body{overflow-y:visible}\n\n/* ---- кнопки ---- */\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 20px;border-radius:var(--radius-btn);border:2px solid transparent;font:600 16px/1 var(--font-sans);cursor:pointer;text-decoration:none;transition:background .18s,border-color .18s,opacity .18s}\n.btn:active{transform:translateY(1px)}\n.btn-primary{background:var(--btn-bg);color:var(--btn-text)}\n.btn-primary:hover{opacity:.9}\n.btn-secondary{background:transparent;color:var(--text);border-color:var(--line)}\n.btn-secondary:hover{border-color:var(--text)}\n.btn-block{width:100%}\n.btn[disabled]{opacity:.4;cursor:not-allowed}\n.link-btn{background:none;border:0;padding:0;font:inherit;color:var(--text);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px}\n\n/* ---- карточки-варианты (Где / направления / семейства) ---- */\n.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--sheet-bg);color:var(--sheet-text);border:var(--frame) solid var(--sheet-line);border-radius:var(--radius-frame);padding:16px;margin-bottom:12px;cursor:pointer;font:inherit;transition:border-color .18s}\n.opt:hover{border-color:var(--moss-300)}\n.opt[aria-pressed=true]{border-color:currentColor}\n.opt.loc-lesnoe{border-color:var(--loc-lesnoe)}\n.opt.loc-online{border-color:var(--loc-lesnoe)}\n.opt.loc-moskva{border-color:var(--loc-moskva-fill)}\n.opt .t{font-weight:700;font-size:17px;display:block}\n.opt .s{font-size:14px;color:var(--sheet-muted);display:block;line-height:1.4;margin-top:2px}\n.opt .pr{margin-left:auto;text-align:right;font-weight:700;white-space:nowrap;font-size:15px}\n.opt .badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:5px;padding:2px 6px;margin-top:6px}\n.opt .badge.lesnoe,.opt .badge.online{border:1.5px solid var(--loc-lesnoe);color:var(--sheet-text)}\n.opt .badge.moskva{background:var(--loc-moskva-fill);color:var(--loc-moskva-text)}\n\n.grid-2{display:grid;gap:10px;grid-template-columns:1fr 1fr}\n@media (max-width:380px){.grid-2{grid-template-columns:1fr}}\n\n/* ---- чипы ---- */\n.chips{display:flex;flex-wrap:wrap;gap:8px}\n.chips-scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent 100%)}\n.chips-scroll::-webkit-scrollbar{display:none}\n.chip{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--text);font:600 14px/1 var(--font-sans);cursor:pointer;white-space:nowrap}\n.chip[aria-pressed=true]{background:var(--pick);border-color:var(--pick);color:var(--pick-ink)}\n.chip:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}\n\n/* ---- календарь месяца ---- */\n.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}\n.cal-head .m{font-family:var(--font-hand);font-size:28px;color:var(--text)}\n.cal-nav{display:flex;gap:4px}\n.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px;color:var(--text-muted);text-align:center;margin-bottom:4px;text-transform:uppercase}\n.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}\n.cal-day{position:relative;aspect-ratio:1/1;border-radius:var(--radius-frame);border:var(--frame) solid transparent;background:transparent;color:var(--text);font:600 14px/1 var(--font-sans);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}\n.cal-day.empty{visibility:hidden;cursor:default}\n.cal-day.closed{color:var(--text-muted);opacity:.35;cursor:not-allowed}\n.cal-day.full{border-color:var(--line);color:var(--text-muted);cursor:not-allowed}\n.cal-day.free.loc-lesnoe,.cal-day.free.loc-online{border-color:var(--loc-lesnoe)}\n.cal-day.free.loc-moskva{background:var(--loc-moskva-fill);color:var(--loc-moskva-text);border-color:var(--loc-moskva-fill)}\n.cal-day.early{position:relative}\n.cal-day.early::after{content:\"\";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--pick)}\n.cal-day[aria-pressed=true]{background:var(--pick);color:var(--pick-ink);border-color:var(--pick)}\n.cal-day .dnum{font-size:15px}\n.cal-day .dtag{font-size:9px;text-transform:uppercase;letter-spacing:.02em;opacity:.85}\n.cal-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text-muted);margin:10px 0 4px}\n.cal-legend span{display:inline-flex;align-items:center;gap:6px}\n.cal-legend i{width:12px;height:12px;border-radius:4px;border:2px solid var(--loc-lesnoe);display:inline-block}\n.cal-legend i.moskva{background:var(--loc-moskva-fill);border-color:var(--loc-moskva-fill)}\n\n/* ---- поля формы ---- */\n.field{margin-bottom:16px}\n.field label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}\n.field input,.field textarea{width:100%;min-height:48px;border:2px solid var(--line);border-radius:10px;background:var(--sheet-bg);color:var(--sheet-text);padding:12px 14px;font:400 16px/1.4 var(--font-sans)}\n.field textarea{min-height:84px;resize:vertical}\n.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent-field);box-shadow:0 0 0 3px rgb(126 31 42 / .15)}\n.field.has-error input,.field.has-error textarea{border-color:var(--bordo-500)}\n.err{font-size:13px;color:var(--bordo-200,#E8A0A8);margin-top:6px;line-height:1.4}\n.sheet-body .err,.field .err{color:#ffd7db}\n[data-theme=\"cream\"] .err,body.on-cream .err{color:var(--bordo-500)}\n.hint{font-size:13px;color:var(--text-muted);margin-top:6px;line-height:1.45}\n.warn{font-size:14px;background:var(--loc-moskva-fill);color:var(--loc-moskva-text);border-radius:10px;padding:10px 12px;margin-top:8px}\n.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.45;margin:14px 0;cursor:pointer}\n.check input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--pick)}\n\n/* ---- сводка ---- */\n.summary{background:var(--sheet-bg);color:var(--sheet-text);border:var(--frame) solid var(--sheet-line);border-radius:var(--radius-frame);padding:14px 16px;font-size:15px;margin-bottom:16px}\n.summary dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}\n.summary dt{color:var(--sheet-muted)}\n.summary dd{margin:0;font-weight:700;text-align:right}\n\n/* ---- пустые состояния / успех ---- */\n.empty,.success{text-align:center;padding:12px 4px}\n.empty svg,.success svg{margin:0 auto 12px}\n.ok-circle{width:64px;height:64px;border-radius:50%;background:var(--pick);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--pick-ink)}\n.list-actions{display:grid;gap:10px;margin-top:16px;text-align:left}\n.rule{font-size:13px;color:var(--text-muted);text-align:center;margin:10px 0 0}\n.banner{border:var(--frame) solid var(--pick);border-radius:var(--radius-frame);padding:12px 14px;font-size:14px;margin-bottom:16px;background:var(--bg-alt)}\n.banner.err{border-color:var(--ink-900);background:var(--sheet-bg);color:var(--sheet-text)}\n.banner strong{display:block;margin-bottom:2px}\n\n.qr{display:block;width:170px;height:170px;margin:14px auto;background:#fff;border-radius:12px;padding:10px;border:2px solid var(--line)}\n\n.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink-900);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}\n.toast.show{opacity:1}\n\n/* ---- сообщения (messages.html) карточки мессенджера/письма ---- */\n.msg-block{margin-bottom:28px}\n.msg-block h2{font-size:16px;color:var(--text-muted);text-transform:uppercas nd: 'Marck Script', cursive;   /* только названия месяцев и одно слово-акцент */\n  --radius-frame: 4px; --radius-btn: 6px; --frame: 2px;\n  --tap: 44px;\n\n  /* semantic: moss */\n  --bg: var(--moss-500);          --bg-alt: var(--moss-600);\n  --text: var(--sand-200);        --text-muted: var(--sand-300);   /* 6.8:1 и 5.6:1 на мху */\n  --line: var(--moss-300);\n  --loc-lesnoe: var(--olive-200); /* рамка 5.1:1 */\n  --loc-moskva-fill: var(--bordo-500); --loc-moskva-text: var(--cream-100); /* 8.2:1 */\n  --sheet-bg: var(--cream-100);   --sheet-text: var(--ink-900);   --sheet-muted: var(--ink-600); --sheet-line: var(--line-cream);\n  --btn-bg: var(--sand-200);      --btn-text: var(--ink-900);     /* 13.7:1 */\n  --accent-field: var(--bordo-500);\n  --focus: var(--cream-100);\n  --pick: var(--sand-200); --pick-ink: var(--ink-900);   /* выбранный день, чип, прогресс */\n  --eyebrow: var(--olive-200);\n}\n\n[data-theme=\"night\"] {\n  --bg: var(--moss-900); --bg-alt: var(--moss-800);\n  --text: #F3E6CF; --text-muted: #BDB29B; --line: #3A4128;\n  --loc-moskva-fill: var(--bordo-700);\n  --sheet-bg: var(--moss-800); --sheet-text: #F3E6CF; --sheet-muted: #BDB29B; --sheet-line: #3A4128;\n  --accent-field: var(--bordo-700);\n  --focus: var(--sand-200);\n}\n\n[data-theme=\"cream\"] {\n  --bg: var(--cream-100); --bg-alt: #EEDCC2;\n  --text: var(--ink-900); --text-muted: var(--ink-600); --line: var(--line-cream);\n  --loc-lesnoe: var(--olive-500);  /* только рамка, 4.3:1 ≥ 3:1 для не-текста */\n  --sheet-bg: var(--cream-50);\n  --btn-bg: var(--moss-500); --btn-text: var(--sand-200);\n  --focus: var(--bordo-500);\n  --pick: var(--moss-500); --pick-ink: var(--sand-200);  /* 8.4:1 */\n  --eyebrow: var(--bordo-500);\n}\n\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme]) {\n    --bg: var(--moss-900); --bg-alt: var(--moss-800);\n    --text: #F3E6CF; --text-muted: #BDB29B; --line: #3A4128;\n    --sheet-bg: var(--moss-800); --sheet-text: #F3E6CF; --sheet-muted: #BDB29B; --sheet-line: #3A4128;\n    --loc-moskva-fill: var(--bordo-700); --accent-field: var(--bordo-700); --focus: var(--sand-200);\n  }\n}\n"}}, "pages": {"design/directions/c/pages/404.html": "<!doctype html>\n<html lang=\"ru\" data-theme=\"cream\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Страница не найдена · Ирина Коврова<\/title>\n<meta name=\"description\" content=\"Страница не найдена.\">\n<link rel=\"icon\" href=\"data:,\">\n<link rel=\"preload\" href=\"{{a:design/directions/c/fonts/geologica-cyrillic-wght-normal.woff2}}\" as=\"font\" type=\"font/woff2\" crossorigin=\"anonymous\">\n<link rel=\"stylesheet\" href=\"{{a:design/directions/c/base.css}}\">\n<\/head>\n<body data-slug=\"404.html\">\n<a class=\"skip-link\" href=\"#main\">Перейти к содержанию<\/a>\n<header class=\"site-header\">\n  <div class=\"container site-header__row\">\n    <a class=\"site-header__brand\" href=\"#p:design/directions/c/pages/index.html\">Ирина Коврова <span class=\"hand\">· практика<\/span><\/a>\n    <nav aria-label=\"Основная навигация\">\n      <ul class=\"site-header__nav\"><li><a href=\"#p:design/directions/c/pages/uslugi.html\">Услуги и цены<\/a><\/li><li><a href=\"#p:design/directions/c/pages/raspisanie.html\">Расписание<\/a><\/li><li><a href=\"#p:design/directions/c/pages/ob-irine.html\">Об Ирине<\/a><\/li><li><a href=\"#p:design/directions/c/pages/zametki.html\">Заметки<\/a><\/li><li><a href=\"#p:design/directions/c/pages/sobytiya.html\">События<\/a><\/li><li><a href=\"#p:design/directions/c/pages/voprosy.html\">Вопросы<\/a><\/li><li><a href=\"#p:design/directions/c/pages/kontakty.html\">Контакты<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"site-header__actions\">\n      <a class=\"btn btn-primary\" href=\"#p:design/directions/c/pages/booking/index.html\">Записаться<\/a>\n      <button class=\"nav-toggle\" aria-expanded=\"false\" aria-controls=\"site-nav-panel\" id=\"nav-toggle\" aria-label=\"Меню\">\n дпросмотр страницы «Услуги и цены», как её видит гость\">Показать, как видит гость<\/button>\n  <\/main>\n  <div id=\"tabs-root\"><\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\" role=\"status\"><\/div>\n<script src=\"{{a:design/directions/c/booking-data.js}}\"><\/script>\n<script src=\"{{a:design/directions/c/admin-data.js}}\"><\/script>\n<script>\n(function () {\n  var K = KVR;\n  var ROWS = []; // {dirTitle, famId, famTitle, dur, prices:{lesnoe,moskva,online}, techs}\n  K.DIRECTIONS.forEach(function (d) { d.families.forEach(function (f) { ROWS.push({ dir: d.title, id: f.id, title: f.title, dur: f.durKnown === false ? '[?]' : f.dur + ' мин', prices: { lesnoe: f.prices.lesnoe, moskva: f.prices.moskva, online: f.prices.online } }); }); });\n  var LOCS = ['lesnoe', 'moskva', 'online'];\n\n  function cell(row, loc) {\n    var has = Object.prototype.hasOwnProperty.call(row.prices, loc);\n    if (!has) return '<td class=\"off\" style=\"opacity:.3\">—<\/td>';\n    var v = row.prices[loc];\n    var off = v === undefined;\n    return '<td class=\"' + (off ? 'off' : '') + '\"><input inputmode=\"numeric\" data-row=\"' + row.id + '\" data-loc=\"' + loc + '\" value=\"' + (v == null ? '' : v) + '\" placeholder=\"[?]\" aria-label=\"' + row.title + ', ' + loc + '\">' +\n      '<button class=\"sw\" data-toggle=\"' + row.id + '\" data-loc=\"' + loc + '\">' + (off ? 'выкл' : 'вкл') + '<\/button><\/td>';\n  }\n  function render() {\n    document.querySelector('#matrix tbody').innerHTML = ROWS.map(function (r) {\n      return '<tr><td><b>' + r.title + '<\/b><div class=\"small muted\">' + r.dir + ' · ' + r.dur + '<\/div><\/td>' + LOCS.map(function (l) { return cell(r, l); }).join('') + '<\/tr>';\n    }).join('');\n  }\n  document.addEventListener('change', function (e) {\n    if (e.target.matches('input[data-row]')) { KVR.toast('Сохранено · на сайте примерно через минуту'); }\n  });\n  document.addEventListener('click', function (e) {\n    var sw = e.target.closest('[data-toggle]');\n    if (sw) { var td = sw.closest('td'); td.classList.toggle('off'); sw.textContent = td.classList.contains('off') ? 'выкл' : 'вкл'; KVR.toast(td.classList.contains('off') ? 'Услуга скрыта в этой локации' : 'Услуга снова доступна'); return; }\n    var t = e.target.closest('[data-toast]'); if (t) { KVR.toast(t.dataset.toast); return; }\n  });\n  document.getElementById('bulkApply').addEventListener('click', function () {\n    var loc = document.getElementById('bulkLoc').value, pct = parseFloat(document.getElementById('bulkPct').value);\n    if (!pct) { KVR.toast('Укажите процент изменения'); return; }\n    var count = 0;\n    document.querySelectorAll('input[data-loc=\"' + loc + '\"]').forEach(function (inp) {\n      if (inp.value) { inp.value = Math.round(parseFloat(inp.value) * (1 + pct / 100)); count++; }\n    });\n    KVR.toast(count ? 'Изменено цен: ' + count + ' · сохранено' : 'В этой локации нет заполненных цен');\n  });\n  KVRA.mountNav('ceny');\n  render();\n})();\n<\/script>\n<\/body>\n<\/html>\n", "design/directions/c/pages/admin/gosti.html": "<!doctype html>\n<html lang=\"ru\" data-theme=\"cream\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Гости — кабинет Ирины<\/title>\n<meta name=\"robots\" content=\"noindex\">\n<link rel=\"stylesheet\" href=\"{{a:design/directions/c/tokens.css}}\">\n<link rel=\"stylesheet\" href=\"{{a:design/directions/c/base.css}}\">\n<link rel=\"stylesheet\" href=\"{{a:design/directions/c/admin.css}}\">\n<\/head>\n<body>\n<div class=\"phone\">\n  <header class=\"a-head\"><div><div class=\"t\">Гости<\/div><div class=\"s\">Контакты, визиты, согласия<\/div><\/div><\/header>\n  <main>\n    <div class=\"field\"><label for=\"search\" class=\"sr-only\">Поиск гостя<\/label><input id=\"search\" placeholder=\"Найти по имени или телефону\"><\/div>\n    <div id=\"list\"><\/div>\n  <\/main>\n  <div id=\"tabs-root\"><\/div>\n<\/div>\n<div class=\"toast\ <i><\/i> Лесное / онлайн<\/span><span><i class=\"moskva\"><\/i> Москва<\/span><span><i style=\"background:transparent;opacity:.5\"><\/i> Закрыто<\/span><\/div>\n\n    <h2>Открыть запись<\/h2>\n    <div class=\"card\">\n      <p class=\"small muted\" style=\"margin-top:0\">Когда открывается запись на следующий месяц. Постоянным гостям — доступ на 24 ч раньше.<\/p>\n      <div class=\"field\"><label for=\"odate\">Дата открытия<\/label><input id=\"odate\" type=\"text\" inputmode=\"numeric\" placeholder=\"ДД.ММ.ГГГГ\" pattern=\"\\d{2}\\.\\d{2}\\.\\d{4}\" autocomplete=\"off\"><\/div>\n      <div class=\"field\"><label for=\"otime\">Время<\/label><input id=\"otime\" type=\"text\" inputmode=\"numeric\" placeholder=\"ЧЧ:ММ\" value=\"11:00\" pattern=\"\\d{2}:\\d{2}\" autocomplete=\"off\"><\/div>\n      <button class=\"btn block\" id=\"openRelease\">Открыть запись<\/button>\n    <\/div>\n    <p class=\"note\" id=\"selNote\"><\/p>\n  <\/main>\n  <div id=\"tabs-root\"><\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\" role=\"status\"><\/div>\n<script src=\"{{a:design/directions/c/booking-data.js}}\"><\/script>\n<script src=\"{{a:design/directions/c/admin-data.js}}\"><\/script>\n<script>\n(function () {\n  var K = KVR, now = new Date();\n  var m = new Date(now.getFullYear(), now.getMonth(), 1);\n  var WD = ['пн','вт','ср','чт','пт','сб','вс'];\n  document.getElementById('wd').innerHTML = WD.map(function (w) { return '<span>' + w + '<\/span>'; }).join('');\n  var selected = null;\n\n  function render() {\n    document.getElementById('mLabel').textContent = K.MONTHS_NOM[m.getMonth()] + ' ' + m.getFullYear();\n    var first = new Date(m.getFullYear(), m.getMonth(), 1);\n    var offset = (first.getDay() + 6) % 7;\n    var days = KVRA.monthSchedule(m.getFullYear(), m.getMonth());\n    var cells = [];\n    for (var i = 0; i < offset; i++) cells.push('<span class=\"cal-day empty\"><\/span>');\n    var todayIso = K.iso(now);\n    days.forEach(function (d) {\n      var cls = ['cal-day'] я. <span class=\"q\">[?]<\/span> — факт уточняется у Ирины.<\/div>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <defs>\n    <symbol id=\"i-back\" viewBox=\"0 0 24 24\"><path fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M15 5l-7 7 7 7\"/><\/symbol>\n    <symbol id=\"i-close\" viewBox=\"0 0 24 24\"><path stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" d=\"M6 6l12 12M18 6L6 18\"/><\/symbol>\n    <symbol id=\"i-check\" viewBox=\"0 0 24 24\"><path fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M5 12.5l4.5 4.5L19 7.5\"/><\/symbol>\n    <symbol id=\"i-chevron-l\" viewBox=\"0 0 24 24\"><path fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M15 5l-7 7 7 7\"/><\/symbol>\n    <symbol id=\"i-chevron-r\" viewBox=\"0 0 24 24\"><path fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M9 5l7 7-7 7\"/><\/symbol>\n  <\/defs>\n<\/svg>\n\n<div class=\"page\" id=\"page\">\n  <header class=\"bk-head\">\n    <button class=\"icon-btn\" id=\"btnBack\" aria-label=\"Назад\"><svg width=\"22\" height=\"22\"><use href=\"#i-back\"><\/use><\/svg><\/button>\n    <h1 id=\"stepTitle\">Запись<\/h1>\n    <a class=\"icon-btn\" id=\"btnClose\" href=\"#p:design/directions/c/pages/index.html\" aria-label=\"Закрыть запись\"><svg width=\"22\" height=\"22\"><use href=\"#i-close\"><\/use><\/svg><\/a>\n  <\/header>\n  <div class=\"progress\" aria-hidden=\"true\"><i id=\"progressBar\" style=\"width:14%\"><\/i><\/div>\n  <main class=\"bk-body\" id=\"body\" aria-live=\"polite\" tabindex=\"-1\"><\/main>\n  <div class=\"bk-foot\" id=\"foot\"><\/div>\n  <p class=\"bk-legal\">Услуги не являются медицинскими. При заболеваниях и противопоказаниях проконсультируйтесь с врачом.<\/p>\n<\/div>\n<div class=\"toast\" id=\"toast\" role=\"status\"><\/div>\n\n<script src=\"{{a:design/directions/c/booking-data.js}}\"><\/script>\n<script>\n(function () {\n  'use strict';\n  var K = window.KVR;\n  var body = K.$('#body'), foot = K.$('#foot'), titleEl = K.$('#stepTitle'), backBtn = K.$('#btnBack'), progressBar = K.$('#progressBar');\n  var now = new Date();\n\n  var S = { step: 'loc', loc: null, dirId: null, famId: null, tech: null, date: null, time: null, filter: 'all',\n    name: '', phone: '', channel: 'telegram', comment: '', consent: false, marketing: false,\n    calMonth: new Date(now.getFullYear(), now.getMonth(), 1), started: Date.now(), payFailed: false, quizAnswers: [] };\n\n  var STEP_ORDER = ['loc', 'direction', 'family', 'when', 'contacts', 'pay', 'done'];\n  var BACK = { direction: 'loc', family: 'direction', when: null /* computed */, contacts: 'when', pay: 'contacts', quiz: 'direction', race: 'when', payerror: 'pay' };\n\n  function dirObj() { return K.findDirection(S.dirId); }\n  function famObj() { return K.findFamily(S.dirId, S.famId); }\n  function price() { var f = famObj(); return f ? f.prices[S.loc] : null; }\n  function locObj() { return K.LOCS.filter(function (l) { return l.id === S.loc; })[0]; }\n\n  function backTargetFor(step) {\n    if (step === 'when') { var d = dirObj(); return (d && d.families.length > 1) ? 'family' : 'direction'; }\n    return BACK[step] || null;\n  }\n\n  function urlFor(step) {\n    var p = new URLSearchParams();\n    if (S.loc) p.set('loc', S.loc);\n    if (S.dirId) p.set('svc', S.dirId);\n    if (S.famId) p.set('fam', S.famId);\n    if (S.date) p.set('date', S.date);\n    if (S.time) p.set('time', S.time);\n    if (step && step !== 'loc') p.set('step', step);\n    if (K.DEMO !== 'default') p.set('demo', K.DEMO);\n    var qstr = p.toString();\n    return location.pathname + (qstr ? '?' + qstr : '');\n  }\n\n  function goStep(step, opts) {\n    S.step = step;\n    var url = urlFor(step);\n    if (opts && opts.replace) history.replaceState({ S: snap() }, '', url);\n    else history.pushState({ S: snap() }, '', url);\n    render();\n  }\n  function snap() { return JSON.parse(JSON.stringify(S)); }\n\n  /* при входе в шаг «Когда» подбираем ближайшую свободную дату сами —\n     иначе пустой календарь до первого тапа выглядел бы как «нет окон» */\n  function goWhen() {\n    if (!S.date) {\n      var nf = nearestFreeDay(S.loc);\n      if (nf) { S.date = K.iso(nf.date); S.calMonth = new Date(nf.date.getFullYear(), nf.date.getMonth(), 1); }\n    }\n    goStep('when');\n  }\n\n  window.addEventListener('popstate', function (e) {\n    if (e.state && e.state.S) { Object.assign(S, e.state.S); render(); }\n    else { S.step = 'loc'; render(); }\n  });\n\n  document.addEventListener('keydown', function (e) {\n    if (e.key === 'Escape') {\n      var b = backTargetFor(S.step);\n      if (b) { goStep(b); } else { K.go('../index.html'); }\n    }\n  });\n\n  backBtn.addEventListener('click', function () {\n    var b = backTargetFor(S.step);\n    if (b) goStep(b); else history.back();\n  });\n\n  /* ---------- начальное состояние из URL (deep-link) ---------- */\n  (function initFromUrl() {\n    var p = new URLSearchParams((window.__QS||location.search));\n    if (p.get('loc')) S.loc = p.get('loc');\n    if (p.get('svc')) S.dirId = p.get('svc');\n    if (p.get('fam')) S.famId = p.get('fam');\n    if (p.get('date')) S.date = p.get('date');\n    if (p.get('time')) S.time = p.get('time');\n    if (S.dirId && !S.famId) {\n      var d0 = K.findDirection(S.dirId);\n      var loc0 = S.loc || (d0 && d0.families.filter(function (f) { return Object.keys(f.prices)[0]; })[0]);\n      var fams0 = d0 ? d0.families.filter(function (f) { return !S.loc || K.familyAvailableIn(f, S.loc); }) : [];\n      if (fams0.length) S.famId = fams0[0].id;\n    }\n    var step = p.get('step');\n    if (step) S.step = step;\n    else if (S.loc && S.dirId && S.date && S.time) S.step = 'contacts';\n    else if (S.loc && S.dirId) S.step = 'when'   var priceHint = fams.length === 1 ? K.rub(fams[0].prices[S.loc]) : '';\n        return '<button class=\"opt\" data-set-dir=\"' + d.id + '\" aria-pressed=\"' + (S.dirId === d.id) + '\">' +\n          '<span><span class=\"t\">' + K.esc(d.title) + '<\/span><span class=\"s\">' + K.esc(d.hint) + '<\/span><\/span>' +\n          (priceHint ? '<span class=\"pr\">' + priceHint + '<\/span>' : '') + '<\/button>';\n      }).join('');\n      return kicker('direction') + top + list + MED_DISCLAIMER;\n    },\n    quiz: function () {\n      var Q = [\n        { q: 'С чем вам сейчас важнее поработать?', opts: [['tension', 'Напряжение, тяжесть в теле'], ['face', 'Лицо и шея'], ['emotion', 'Эмоции и состояние'], ['first', 'Пока не знаю, хочу познакомиться']] },\n      ];\n      return '<p class=\"small\" style=\"margin-bottom:14px\">' + K.esc(Q[0].q) + '<\/p>' +\n        Q[0].opts.map(function (o) { return '<button class=\"opt\" data-quiz=\"' + o[0] + '\"><span class=\"t\">' + K.esc(o[1]) + '<\/span><\/button>'; }).join('') +\n        '<p class=\"hint\">Три вопроса — и я подскажу, с чего начать. Решение всегда за вами.<\/p>';\n    },\n    family: function () {\n      var d = dirObj();\n      var fams = d.families.filter(function (f) { return K.familyAvailableIn(f, S.loc); });\n      return kicker('family') + fams.map(function (f) {\n        return '<button class=\"opt\" data-set-fam=\"' + f.id + '\" aria-pressed=\"' + (S.famId === f.id) + '\">' +\n          '<span><span class=\"t\">' + K.esc(f.title) + '<\/span><span class=\"s\">' + (f.durKnown === false ? 'Длительность [?]' : f.dur + ' мин') +\n          (f.note ? ' · ' + K.esc(f.note) : '') + '<\/span><\/span><span class=\"pr\">' + K.rub(f.prices[S.loc]) + '<\/span><\/button>';\n      }).join('') + '<p class=\"small muted\" style=\"text-align:center;margin-top:10px\">Не знаете, что выбрать? <button class=\"link-btn\" data-set-repeat-first=\"1\">Начните с первичного приёма<\/button><\/p>' + MED_DISCLAIMER;\n    },\n    when: function () {\n      var f = famObj();\n      var html = kicker('when');\n      if (K.IS_REGULAR) html += '<div class=\"banner\"><strong>Ранний доступ<\/strong>Вы постоянная гостья — вам открыт следующий месяц на ' + K.REGULAR_EARLY_H + ' часа раньше остальных.<\/div>';\n      html += renderCalendar();\n      html += '<div class=\"cal-legend\"><span><i><\/i> Лесное / онлайн<\/span><span><i class=\"moskva\"><\/i> Москва<\/span><\/div>';\n      html += '<div class=\"chips chips-scroll\" style=\"margin:12px 0 14px\">' + [['all', 'Любое'], ['morning', 'Утро'], ['day', 'День'], ['evening', 'Вечер']].map(function (kv) {\n        return '<button class=\"chip\" data-filter=\"' + kv[0] + '\" aria-pressed=\"' + (S.filter === kv[0]) + '\">' + kv[1] + '<\/button>';\n      }).join('') + '<\/div>';\n      if (f && f.techs) {\n        html += '<p class=\"small\" style=\"font-weight:600;margin:6px 0 8px\">Техника <span class=\"muted\" style=\"font-weight:400\">— можно выбрать позже, до ' + K.TECH_DEADLINE + '<\/span><\/p>' +\n          '<div class=\"chips chips-scroll\" style=\"margin-bottom:16px\">' +\n            '<button class=\"chip\" data-set-tech=\"\" aria-pressed=\"' + (!S.tech) + '\">Выберу позже<\/button>' +\n            f.techs.map(function (t) {\n              return '<button class=\"chip\" data-set-tech=\"' + K.esc(t) + '\" aria-pressed=\"' + (S.tech === t) + '\">' + K.esc(t) + '<\/button>';\n            }).join('') + '<\/div>';\n      }\n      if (!S.date) { html += emptyState(); return html; }\n      var dObj = new Date(S.date + 'T00:00');\n      var all = K.slotsFor(S.loc, dObj, now).filter(function (x) { return S.filter === 'all' || K.partOf(x.time) === S.filter; });\n      var free = all.filter(function (x) { return x.free; });\n      html += '<p class=\"small\" style=\"font-weight:600;margin-bottom:8px\">' + K.fmtDay.format(dObj) + (f ? ' · ' + (f.durKnown === false ? 'длительность [?]' : f.dur + ' мин') : '') + '<\/p>';\n      if (!all.length || !free.length) { K.track('booking_no_slots', { loc: S.loc, date: S.date }); html += emptyState(); return html; }\n      html += '<div class=\"chips\">' + all.map(function (x) {\n        return '<button class=\"chip\" ' + (x.free ? '' : 'disabled') + ' data-set-time=\"' + x.time + '\" aria-pressed=\"' + (S.time === x.time) + '\" aria-label=\"' + x.time + (x.free ? '' : ', занято') + '\">' + x.time + '<\/button>';\n      }).join('') + '<\/div>' +\n        '<p class=\"small muted\" style=\"margin-top:14px\">Нет подходящего времени? <button class=\"link-btn\" data-go-wl=\"1\">Встать в лист ожидания<\/button><\/p>';\n      return html;\n    },\n    contacts: function () {\n      var f = famObj(), d = new Date(S.date + 'T00:00');\n      return kicker('contacts') + summaryBlock(d, f) + contactFields(true);\n    },\n    race: function () {\n      var alts = raceAlternatives();\n      return '<div class=\"banner err\"><strong>Это время только что заняли<\/strong>Ничего страшного — деньги не списаны, вот ближайшие варианты. Ваши данные сохранены.<\/div>' +\n        '<div class=\"chips\">' + alts.map(function (a) {\n          return '<button class=\"chip\" data-pick-alt=\"' + a.date + '|' + a.time + '\">' + K.fmtShort.format(new Date(a.date + 'T00:00')) + ', ' + a.time + '<\/button>';\n        }).join('') + '<\/div>';\n    },\n    pay: function () {\n      var f = famObj();\n      return '<div class=\"success\"><p class=\"muted small\">Демо оплаты через СБП. В продукте на телефоне откроется банковское приложение; на большом экране — можно отсканировать QR.<\/p>' +\n        '<div class=\"pay-qr\">' + K.qrSvg(S.date + S.time) + '<\/div>' +\n        '<p><b>' + K.PREPAY.toLocaleString('ru-RU') + ' ₽<\/b> · предоплата за ' + K.esc((f.title || '').toLowerCase()) + '<\/p>' +\n        '<p class=\"small muted\">Окно держится за вами ' + K.HOLD_MIN + ' минут, пока идёт оплата.<\/p><\/div>';\n    },\n    payerror: function () {\n      return '<div class=\"banner err\"><strong>Оплата не прошла<\/strong>Деньги не nction (e) {\n    var t = e.target.closest('button,a[data-toast]'); if (!t) return;\n    var ds = t.dataset;\n    if (ds.setLoc) { S.loc = ds.setLoc; K.track('booking_step_location', { loc: S.loc }); goStep('direction'); return; }\n    if (ds.goQuiz) { goStep('quiz'); return; }\n    if (ds.quiz) {\n      var map = { tension: 'massage', face: 'face', emotion: 'psy', first: 'first' };\n      setDirection(map[ds.quiz] || 'first');\n      return;\n    }\n    if (ds.setRepeat) {\n      var last = K.loadLastBooking();\n      S.dirId = last.dirId; S.famId = last.famId; S.tech = last.tech || null; S.date = null; S.time = null;\n      K.track('booking_step_service', { svc: S.dirId, repeat: true });\n      goWhen(); return;\n    }\n    if (ds.setRepeatFirst) { setDirection('first'); return; }\n    if (ds.setDir) { setDirection(ds.setDir); return; }\n    if (ds.setFam) { S.famId = ds.setFam; K.track('booking_step_service', { svc: S.dirId, fam: S.famId }); goWhen(); return; }\n    if (ds.setTech !== undefined) { S.tech = ds.setTech || null; render(); return; }\n    if (ds.calPrev) { S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth() - 1, 1); render(); return; }\n    if (ds.calNext) { S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth() + 1, 1); render(); return; }\n    if (ds.setDate) { S.date = ds.setDate; S.time = null; render(); return; }\n    if (ds.filter) { S.filter = ds.filter; render(); return; }\n    if (ds.setTime) { S.time = ds.setTime; K.track('booking_step_time', { date: S.date, time: S.time }); render(); return; }\n    if (ds.altLoc) { S.loc = ds.altLoc; S.date = ds.altDate; S.time = ds.altTime; render(); return; }\n    if (ds.goWl) {\n      var f = famObj();\n      var params = new URLSearchParams({ loc: S.loc || '', svc: S.dirId || '', fam: S.famId || '' });\n      K.go('waitlist.html?' + params.toString());\n      return;\n    }\n    if (ds.next) { goStep('contacts'); return; }\n    if (ds.channel) { S.channel = ds.channel; r алось ' + h + ' ч (меньше 48) — предоплата удерживается. Но если это время заберут из листа ожидания, вернём её полностью.';\n  }\n\n  function render() {\n    if (view === 'summary') return renderSummary();\n    if (view === 'reschedule') return renderReschedule();\n    if (view === 'cancel') return renderCancel();\n    if (view === 'tech') return renderTech();\n    if (view === 'again') return renderAgain();\n  }\n\n  function renderSummary() {\n    var f = famObj(), l = locObj();\n    body.innerHTML = '<div class=\"summary\"><dl>' +\n      '<dt>Гостья<\/dt><dd>' + booking.guestName + '<\/dd>' +\n      '<dt>Когда<\/dt><dd>' + K.fmtDay.format(booking.date) + ', ' + booking.date.toTimeString().slice(0, 5) + '<\/dd>' +\n      '<dt>Что<\/dt><dd>' + K.esc(f.title) + (booking.tech ? ' · ' + K.esc(booking.tech) : '') + '<\/dd>' +\n      '<dt>Где<\/dt><dd>' + K.esc(l.name) + '<\/dd>' +\n      '<dt>Статус<\/dt><dd>Подтверждена<\/dd><\/dl><\/div>' +\n      '<p class=\"hint\">' + refundText() + '<\/p>' +\n      '<div class=\"list-actions\" style=\"margin-top:18px\">' +\n      '<button class=\"btn btn-primary btn-block\" data-v=\"reschedule\">Перенести<\/button>' +\n      (f.techs ? '<button class=\"btn btn-secondary btn-block\" data-v=\"tech\" ' + (techDeadlinePassed() ? 'disabled' : '') + '>Сменить технику' + (techDeadlinePassed() ? ' — время вышло' : '') + '<\/button>' : '') +\n      '<button class=\"btn btn-secondary btn-block\" data-v=\"cancel\">Отменить<\/button>' +\n      '<a class=\"btn btn-secondary btn-block\" href=\"#p:design/directions/c/pages/booking/index.html\">Записаться снова<\/a>' +\n      '<button class=\"btn btn-ghost btn-block\" data-toast=\"В продукте: откроется Telegram-бот по одноразовой ссылке ?start=' + token + '\">Подключить Telegram<\/button>' +\n      '<button class=\"btn btn-ghost btn-block\" data-toast=\"В продукте: откроется MAX-бот по одноразовой ссылке\">Подключить MAX<\/button>' +\n      '<\/div>' +\n      '<p class=\"rule\">Код записи: ' + token + '<\/p>';\n  }\n\n  function renderReschedule() {\n    var opts = [];\n    var d = new Date(now); d.setDate(d.getDate() + 1);\n    for (var i = 0; i < 14 && opts.length < 6; i++) {\n      K.slotsFor(booking.loc, d, now).forEach(function (x) { if (x.free && opts.length < 6) opts.push({ date: new Date(d), time: x.time }); });\n      d.setDate(d.getDate() + 1);\n    }\n    body.innerHTML = '<button class=\"link-btn\" data-v=\"summary\" style=\"margin-bottom:12px\">← Назад к записи<\/button>' +\n      '<p class=\"small muted\">' + (hoursLeft() < 48 ? 'До визита меньше 48&nbsp;часов: перенос возможен один раз, если есть окно в ближайшие 14&nbsp;дней.' : 'Выберите новое время — цена и предоплата не изменятся.') + '<\/p>' +\n      '<div class=\"chips\" style=\"flex-direction:column;align-items:stretch;gap:8px\">' + opts.map(function (o) {\n        return '<button class=\"chip\" style=\"justify-content:space-between;display:flex\" data-pick=\"' + K.iso(o.date) + '|' + o.time + '\">' + K.fmtDay.format(o.date) + ' · ' + o.time + '<\/button>';\n      }).join('') + '<\/div>';\n  }\n\n  function renderCancel() {\n    body.innerHTML = '<button class=\"link-btn\" data-v=\"summary\" style=\"margin-bottom:12px\">← Назад к записи<\/button>' +\n      '<div class=\"banner\"><strong>Отмена записи<\/strong>' + refundText() + '<\/div>' +\n      '<p class=\"small muted\">Если передумаете — можно записаться снова в любой момент.<\/p>' +\n      '<button class=\"btn btn-primary btn-block\" data-confirm-cancel=\"1\">Подтвердить отмену<\/button>';\n  }\n\n  function renderTech() {\n    var f = famObj();\n    body.innerHTML = '<button class=\"link-btn\" data-v=\"summary\" style=\"margin-bottom:12px\">← Назад к записи<\/button>' +\n      '<p class=\"small muted\">Можно поменять до 18:00 накануне визита, цена не меняется.<\/p>' +\n      '<div class=\"chips chips-scroll\">' + f.techs.map(function (t) {\n        return '<button class=\"chip\" data-set-tech=\"' + K.esc(t) + '\" aria-pressed=\"' + (booking.tech === t) + '\">' + K.esc(t) + '<\/button>';\n      }).join('') + '<\/div>';\n  }\n\n  function renderAgain() {}\n\n  document.addEventListener('click', function (e) {\n    var t = e.target.closest('button,[data-toast]'); if (!t) return; var ds = t.dataset;\n    if (ds.v) { view = ds.v; render(); body.focus({ preventScroll: true }); return; }\n    if (ds.pick) { var pair = ds.pick.split('|'); var d = new Date(pair[0] + 'T' + pair[1]); booking.date = d; K.track('booking_rescheduled', { date: pair[0], time: pair[1] }); view = 'summary'; render(); K.toast('Перенесено на ' + K.fmtDay.format(d) + ', ' + pair[1]); return; }\n    if (ds.setTech !== undefined) { booking.tech = ds.setTech; K.track('booking_tech_changed', { tech: booking.tech }); view = 'summary'; render(); K.toast('Техника изменена: ' + booking.tech); return; }\n    if (ds.confirmCancel !== undefined) { K.track('booking_cancelled', { hoursLeft: hoursLeft() }); body.innerHTML = '<div class=\"success\">' +\n      '<div class=\"ok-circle\"><svg width=\"30\" height=\"30\"><use href=\"#i-check\"><\/use><\/svg><\/div><h2>Запись отменена<\/h2>' +\n      '<p class=\"small muted\">' + refundText() + '<\/p>' +\n      '<a class=\"btn btn-secondary btn-block\" style=\"margin-top:16px\" href=\"#p:design/directions/c/pages/booking/index.html\">Записаться снова<\/a><\/div>'; return; }\n    if (t.dataset.toast) { K.toast(t.dataset.toast); return; }\n  });\n\n  render();\n})();\n<\/script>\n<\/body>\n<\/html>\n", "design/directions/c/pages/booking/messages.html": "<!doctype html>\n<html lang=\"ru\" data-theme=\"cream\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Письма и сообщения — Ирина Коврова<\/title>\n<meta name=\"robots\" content=\"noindex\">\n<meta name=\"description\" content=\"Как выглядят сообщения гостю: подтверждение, напоминания за 48 и 3&nbsp;часа, предложение из листа ожидания.\">\n<meta name=\"theme-col defs>\n<\/svg>\n<div class=\"page\" id=\"page\">\n  <header class=\"bk-head\">\n    <span class=\"icon-btn\" aria-hidden=\"true\"><\/span>\n    <h1>Ваше окно<\/h1>\n    <a class=\"icon-btn\" href=\"#p:design/directions/c/pages/index.html\" aria-label=\"Закрыть\"><svg width=\"22\" height=\"22\"><use href=\"#i-close\"><\/use><\/svg><\/a>\n  <\/header>\n  <main class=\"bk-body\" id=\"body\" aria-live=\"polite\" tabindex=\"-1\"><\/main>\n  <div class=\"bk-foot\" id=\"foot\"><\/div>\n  <p class=\"bk-legal\">Услуги не являются медицинскими. При заболеваниях и противопоказаниях проконсультируйтесь с врачом.<\/p>\n<\/div>\n<script src=\"{{a:design/directions/c/booking-data.js}}\"><\/script>\n<script>\n(function () {\n  'use strict';\n  var K = window.KVR;\n  var body = K.$('#body'), foot = K.$('#foot');\n  var state = new URLSearchParams((window.__QS||location.search)).get('state') || 'active'; // active | taken | claimed\n  var offer = { name: 'Анна', date: 'сб, 4 октября', time: '11:00', svc: 'Массаж 90&nbsp;минут', loc: 'Пригород Лесное', holdUntil: '12:10' };\n\n  function render() {\n    if (state === 'taken') {\n      body.innerHTML = '<div class=\"banner\"><strong>Это окно уже забрали<\/strong>Вы остаётесь в листе ожидания — я напишу, как только появится следующее подходящее время.<\/div>' +\n        '<p class=\"small muted\">Спасибо за терпение. Раз в месяц буду спрашивать, ждёте ли вы ещё.<\/p>';\n      foot.innerHTML = '<a class=\"btn btn-secondary btn-block\" href=\"#p:design/directions/c/pages/booking/index.html\">Открыть запись заново<\/a>';\n      return;\n    }\n    if (state === 'claimed') {\n      body.innerHTML = '<div class=\"success\"><div class=\"ok-circle\"><svg width=\"30\" height=\"30\"><use href=\"#i-check\"><\/use><\/svg><\/div>' +\n        '<h2>Окно за вами<\/h2><p>' + offer.date + ', ' + offer.time + '<br>' + offer.svc + ' · ' + offer.loc + '<\/p>' +\n        '<p class=\"small muted\">Подтверждение и напоминания придут в выбранный канал.<\/p><\/d nnel: 'telegram', consent: false, marketing: false, done: false,\n  };\n  if (!S.famId) { var d0 = K.findDirection(S.dirId); S.famId = d0 ? d0.families.filter(function (f) { return K.familyAvailableIn(f, S.loc); })[0].id : null; }\n\n  function locObj() { return K.LOCS.filter(function (l) { return l.id === S.loc; })[0]; }\n  function famObj() { return K.findFamily(S.dirId, S.famId); }\n\n  var WINDOWS = [['wd-m', 'Будни утром'], ['wd-d', 'Будни днём'], ['wd-e', 'Будни вечером'], ['we-m', 'Выходные утром'], ['we-d', 'Выходные днём'], ['we-e', 'Выходные вечером']];\n  var HORIZONS = [['2w', '2 недели'], ['month', 'месяц'], ['2m', '2 месяца']];\n\n  function render() {\n    if (S.done) return renderDone();\n    var f = famObj();\n    body.innerHTML =\n      '<p class=\"small muted\">Отметьте, когда вам удобно. Как только освободится подходящее окно, я пришлю сообщение. На ответ будет 30&nbsp;минут, потом предложу следующей гостье.<\/p>' +\n      '<div class=\"summary\"><dl><dt>Где<\/dt><dd>' + K.esc(locObj().name) + '<\/dd><dt>Что<\/dt><dd>' + (f ? K.esc(f.title) : 'Любая длительность от 60&nbsp;мин') + '<\/dd><\/dl><\/div>' +\n      '<p class=\"small\" style=\"font-weight:600;margin-bottom:8px\">Удобное время<\/p>' +\n      '<div class=\"chips\" style=\"margin-bottom:16px\">' + WINDOWS.map(function (kv) { return '<button class=\"chip\" data-w=\"' + kv[0] + '\" aria-pressed=\"' + S.windows.has(kv[0]) + '\">' + kv[1] + '<\/button>'; }).join('') + '<\/div>' +\n      '<p class=\"small\" style=\"font-weight:600;margin-bottom:8px\">Жду не дольше<\/p>' +\n      '<div class=\"chips\" style=\"margin-bottom:18px\">' + HORIZONS.map(function (kv) { return '<button class=\"chip\" data-h=\"' + kv[0] + '\" aria-pressed=\"' + (S.horizon === kv[0]) + '\">' + kv[1] + '<\/button>'; }).join('') + '<\/div>' +\n      contactFields();\n    foot.innerHTML = '<button class=\"btn btn-primary btn-block\" data-submit=\"1\" ' + (S.windows.size ? '' : 'disabled') + '>Встать в лист ожидания<\/button>';\n  }\n  function contactFields() {\n    var e = S._errs || {};\n    return '<div class=\"field' + (e.name ? ' has-error' : '') + '\"><label for=\"f-name\">Как к вам обращаться<\/label><input id=\"f-name\" autocomplete=\"name\" value=\"' + K.esc(S.name) + '\" data-bind=\"name\">' + (e.name ? '<p class=\"err\">Напишите, пожалуйста, имя<\/p>' : '') + '<\/div>' +\n      '<div class=\"field' + (e.phone ? ' has-error' : '') + '\"><label for=\"f-phone\">Телефон<\/label><input id=\"f-phone\" type=\"tel\" inputmode=\"tel\" autocomplete=\"tel\" placeholder=\"+7 (___) ___-__-__\" value=\"' + K.esc(S.phone) + '\" data-bind=\"phone\">' + (e.phone ? '<p class=\"err\">Проверьте номер<\/p>' : '') + '<\/div>' +\n      '<div class=\"field\"><span style=\"display:block;font-weight:600;font-size:15px;margin-bottom:6px\">Куда написать<\/span><div class=\"chips\">' + [['telegram', 'Telegram'], ['max', 'MAX'], ['sms', 'SMS']].map(function (kv) { return '<button class=\"chip\" data-channel=\"' + kv[0] + '\" aria-pressed=\"' + (S.channel === kv[0]) + '\">' + kv[1] + '<\/button>'; }).join('') + '<\/div><\/div>' +\n      '<label class=\"check\"><input type=\"checkbox\" data-bind=\"consent\" ' + (S.consent ? 'checked' : '') + '><span>Соглашаюсь на <a href=\"#p:design/directions/c/pages/legal-soglasie.html\" target=\"_blank\" rel=\"noopener\">обработку персональных данных<\/a><\/span><\/label>' +\n      (e.consent ? '<p class=\"err\">Без согласия не сможем добавить вас в лист — это требование 152-ФЗ<\/p>' : '') +\n      '<label class=\"check\"><input type=\"checkbox\" data-bind=\"marketing\" ' + (S.marketing ? 'checked' : '') + '><span class=\"muted\">Хочу получать новости и приглашения (необязательно)<\/span><\/label>';\n  }\n  function renderDone() {\n    body.innerHTML = '<div class=\"success\"><svg width=\"150\" height=\"70\" viewBox=\"0 0 150 70\" aria-hidden=\"true\"><ellipse cx=\"38\" cy=\"46\" rx=\"30\" ry=\"18\" fill=\"var(--bg-alt)\"/><ellipse cx=\"86\" cy=\"50\" rx=\"24\" ry=\"1 e = K.formatPhone(e.target.value); S.phone = e.target.value; if (pos) e.target.setSelectionRange(e.target.value.length, e.target.value.length); }\n    else S[k] = e.target.value;\n  });\n  document.addEventListener('change', function (e) { if (e.target.type === 'checkbox' && e.target.dataset.bind) S[e.target.dataset.bind] = e.target.checked; });\n\n  K.track('booking_started', { entry: 'waitlist', loc: S.loc, svc: S.dirId });\n  render();\n})();\n<\/script>\n<\/body>\n<\/html>\n", "design/directions/c/pages/index.html": "<!doctype html>\n<html lang=\"ru\" data-theme=\"cream\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ирина Коврова — массаж, остеопрактика и психосоматика · Ирина Коврова<\/title>\n<meta name=\"description\" content=\"Практика массажа, остеопрактики и психосоматики: Пригород Лесное, Москва и онлайн. Запись по датам месяца, бережно и честно.\">\n<link rel=\"icon\" href=\"data:,\">\n<link rel=\"preload\" href=\"{{a:design/directions/c/fonts/geologica-cyrillic-wght-normal.woff2}}\" as=\"font\" type=\"font/woff2\" crossorigin=\"anonymous\">\n<link rel=\"stylesheet\" href=\"{{a:design/directions/c/base.css}}\">\n<\/head>\n<body data-slug=\"index.html\">\n<a class=\"skip-link\" href=\"#main\">Перейти к содержанию<\/a>\n<header class=\"site-header\">\n  <div class=\"container site-header__row\">\n    <a class=\"site-header__brand\" href=\"#p:design/directions/c/pages/index.html\">Ирина Коврова <span class=\"hand\">· практика<\/span><\/a>\n    <nav aria-label=\"Основная навигация\">\n      <ul class=\"site-header__nav\"><li><a href=\"#p:design/directions/c/pages/uslugi.html\">Услуги и цены<\/a><\/li><li><a href=\"#p:design/directions/c/pages/raspisanie.html\">Расписание<\/a><\/li><li><a href=\"#p:design/directions/c/pages/ob-irine.html\">Об Ирине<\/a><\/li><li><a href=\"#p:design/directions/c/pages/zametki.html\">Заметки<\/a><\/li><li><a href=\"#p:design/directions/c/pages/sobytiya.html демо<\/span><\/button><\/div><div class=\"calendar__day\">29<\/div><div class=\"calendar__day\">30<\/div><div class=\"calendar__day\">31<\/div>\n    <\/div>\n    <div class=\"calendar__legend\">\n      <span><span class=\"calendar__swatch calendar__swatch--lesnoe\"><\/span>Пригород Лесное / Онлайн<\/span>\n      <span><span class=\"calendar__swatch calendar__swatch--moskva\"><\/span>Москва<\/span>\n      <span><span class=\"calendar__swatch calendar__swatch--demo\"><\/span>мест нет<\/span>\n    <\/div>\n  <\/div>\n  <p class=\"small muted\" style=\"margin-top:12px\"><a class=\"btn-text\" href=\"#p:design/directions/c/pages/raspisanie.html\">Открыть расписание целиком →<\/a><\/p>\n<\/section>\n\n<section class=\"section container\" aria-labelledby=\"intents-h\">\n  <div class=\"section-head\">\n    <h2 id=\"intents-h\">С чем вы пришли<\/h2>\n    <p>Три входа вместо длинного прайса — а варианты по месту и длительности увидите на следующем шаге.<\/p>\n  <\/div>\n  <div class=\"card-grid\">\n    <a class=\"intent-card\" href=\"#p:design/directions/c/pages/uslugi.html#napryazhenie\"><h3>Напряжение в теле<\/h3><p>Классический, лимфодренажный массаж, остеопрактика, БЭМ.<\/p><\/a>\n    <a class=\"intent-card\" href=\"#p:design/directions/c/pages/uslugi.html#emocii\"><h3>Эмоции и психосоматика<\/h3><p>Сессия психосоматики, метафорические карты.<\/p><\/a>\n    <a class=\"intent-card\" href=\"#p:design/directions/c/pages/uslugi.html#otdyh\"><h3>Отдых и восстановление<\/h3><p>Стоун-массаж, биодинамика — бережные, небыстрые практики.<\/p><\/a>\n    <a class=\"intent-card\" href=\"#p:design/directions/c/pages/uslugi.html#lico\"><h3>Лицо<\/h3><p>Массаж лица и ШВЗ, маски для лица.<\/p><\/a>\n    <a class=\"intent-card\" href=\"#p:design/directions/c/pages/pervichnyj-priem.html\"><h3>Впервые у меня<\/h3><p>Первичный приём — знакомство, точка А, начало работы.<\/p><\/a>\n    <a class=\"intent-card\" href=\"#p:design/directions/c/pages/podbor.html\"><h3>Не знаю, что выбрать<\/h3><p>Три вопроса → 1–2 рекомендации.<\/p><\/a>\n  <\/div>\n<\/section>\n\n<section class=\"section container\" aria-labelledby=\"space-h\">\n  <div class=\"section-head\"><h2 id=\"space-h\">Пространство<\/h2><p>Кабинет в Пригороде Лесное — тёплый свет, тишина, плед и камни.<\/p><\/div>\n  <div class=\"card-grid\">\n    <figure class=\"hero__figure\"><img src=\"{{a:content/photos/kabinet-konsultaciya.webp}}\" alt=\"Ирина Коврова в кабинете\" style=\"object-position: center 10%; aspect-ratio:3/4; object-fit:cover;\"><\/figure>\n    <!-- фото: кабинет при дневном свете — общий план, стол, плед, масла -->\n    <div class=\"photo-placeholder\" role=\"img\" aria-label=\"Фото кабинета появится после съёмки\">Фото скоро<\/div>\n    <!-- фото: вход и дорога к кабинету для страницы «как добраться» -->\n    <div class=\"photo-placeholder\" role=\"img\" aria-label=\"Фото появится после съёмки\">Фото скоро<\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section container sheet\" aria-labelledby=\"about-h\">\n  <h2 id=\"about-h\">Об Ирине<\/h2>\n  <p class=\"sheet-prose\">Практик массажа, остеопрактики и психосоматики. Работаю бережно: вы регулируете силу сами, можно поменять технику накануне, вы решаете, продолжать ли. Не обещаю результата — мы работаем вместе, а ваши успехи — ваши.<\/p>\n  <a class=\"btn-text\" href=\"#p:design/directions/c/pages/ob-irine.html\">Читать подробнее →<\/a>\n<\/section>\n\n<section class=\"section container\" aria-labelledby=\"reviews-h\">\n  <div class=\"section-head\"><h2 id=\"reviews-h\">Слова гостей<\/h2><\/div>\n  <div class=\"empty-state sheet\">\n    <p>Пока нет слов гостей, опубликованных с их согласия. Как только гости разрешат — здесь появятся их слова, без правок и без звёзд-рейтингов.<\/p>\n    <a class=\"btn-text\" href=\"#p:design/directions/c/pages/otzyvy.html\">Как устроены отзывы →<\/a>\n  <\/div>\n<\/section>\n\n<section class=\"section container sheet\" aria-labelledby=\"first-h\">\n  <h2 id=\"first-h\">Если вы впервые<\/h2>\n  <p class=\"sheet-prose\">Если вы решаетесь попробовать новое — нового специалиста, метод или впервые обращаетесь за поддержкой — я делаю особые условия. На первичном приёме мы знакомимся, обсуждаем запрос, фиксируем «точку А» и уже начинаем работу.<\/p>\n  <a class=\"btn btn-secondary\" href=\"#p:design/directions/c/pages/pervichnyj-priem.html\">О первичном приёме<\/a>\n<\/section>\n\n<section class=\"section container\" aria-labelledby=\"events-h\">\n  <div class=\"section-head\"><h2 id=\"events-h\">События и курсы<\/h2><\/div>\n  <div class=\"card-grid\">\n    <div class=\"event-card\">\n      <div class=\"event-card__meta\"><span>Мастер-класс<\/span><span>Дата уточняется [?]<\/span><\/div>\n      <h3>Тема события уточняется [?]<\/h3>\n      <p class=\"muted\">Список ближайших событий появится после уточнения расписания у Ирины.<\/p>\n      <a class=\"btn-text\" href=\"#p:design/directions/c/pages/sobytiya.html\">Все события →<\/a>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section container sheet\" aria-labelledby=\"contacts-h\">\n  <h2 id=\"contacts-h\">Контакты<\/h2>\n  <p>Telegram: <a href=\"https://t.me/protchenko_irina\">@protchenko_irina<\/a> · во время сеансов Ирина не берёт трубку — быстрее написать.<\/p>\n  <a class=\"btn btn-primary\" href=\"#p:design/directions/c/pages/kontakty.html\">Все контакты и локации<\/a>\n<\/section>\n<\/main><footer class=\"site-footer\">\n  <div class=\"container\">\n    <div class=\"site-footer__grid\">\n      <div>\n        <h4>Места<\/h4>\n        <ul>\n          <li><a href=\"#p:design/directions/c/pages/lesnoe.html\">Пригород Лесное (ПЛ)<\/a><\/li>\n          <li><a href=\"#p:design/directions/c/pages/moskva.html\">Москва · м. Таганская<\/a><\/li>\n          <li><a href=\"#p:design/directions/c/pages/online.html\">Онлайн<\/a><\/li>\n        <\/ul>\n      <\/div>\n      <div>\n        <h4>Сайт<\/h4>\n        <ul>\n          <li><a href=\"#p:design/directions/c/pages/uslugi.html\">Услуги и цены<\/a><\/li>\n p=\"round\"/><\/svg>\n      <\/button>\n    <\/div>\n  <\/div>\n  <div class=\"site-nav-panel\" id=\"site-nav-panel\">\n    <div class=\"container\">\n      <ul><li><a href=\"#p:design/directions/c/pages/uslugi.html\">Услуги и цены<\/a><\/li><li><a href=\"#p:design/directions/c/pages/raspisanie.html\">Расписание<\/a><\/li><li><a href=\"#p:design/directions/c/pages/ob-irine.html\">Об Ирине<\/a><\/li><li><a href=\"#p:design/directions/c/pages/zametki.html\">Заметки<\/a><\/li><li><a href=\"#p:design/directions/c/pages/sobytiya.html\">События<\/a><\/li><li><a href=\"#p:design/directions/c/pages/voprosy.html\">Вопросы<\/a><\/li><li><a href=\"#p:design/directions/c/pages/kontakty.html\">Контакты<\/a><\/li><li><a href=\"#p:design/directions/c/pages/booking/index.html\">Записаться<\/a><\/li><\/ul>\n    <\/div>\n  <\/div>\n<\/header>\n<main id=\"main\">\n<section class=\"section container\">\n  <h1>Первичный приём<\/h1>\n  <p class=\"hero__lede\">Возможно, вы заметили: в прайсе есть такая услуга. Вот что она подразумевает и как проходит.<\/p>\n\n  <div class=\"card-grid\" style=\"margin-top:24px\">\n    <div class=\"sheet sheet-prose\">\n      <h2>Пригород Лесное, Москва<\/h2>\n      <p>Если вы хотите попасть ко мне впервые на очный приём, при встрече нам важно будет познакомиться:<\/p>\n      <ul>\n        <li>обсудить вашу задачу, ожидания и пожелания;<\/li>\n        <li>зафиксировать «точку А»: что происходит с телом и эмоциональным состоянием. По запросу — первичные тестирования и фото для отслеживания результатов (эти фото не загружаются на сайт и хранятся отдельно, с вашего письменного согласия);<\/li>\n        <li>подобрать стратегию и методы работы;<\/li>\n        <li>начать: хотя бы часть встречи посвятить коррекции.<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"sheet sheet-prose\">\n      <h2>Онлайн<\/h2>\n      <p>Суть та же: нам важно познакомиться, обсудить ваш запрос и методы работы. Почти все услуги онлайн подразумевают видеосвязь, поэтому для знакомства она тоже важна. При записи будьте готовы — до встречи мы согласуем, а возможно и протестируем техническую связь.<\/p>\n    <\/div>\n  <\/div>\n\n  <div class=\"sheet\" style=\"margin-top:24px\">\n    <p>Я понимаю: на первичном приёме мы встречаемся, если вы решаетесь попробовать новое — нового специалиста, новый метод или впервые обращаетесь за поддержкой в своей задаче. Изменения — это и так задача со звёздочкой. Поэтому я делаю особые условия.<\/p>\n    <p>Берегите себя, и пусть в этот первый момент вам будет немного полегче 🍀<\/p>\n  <\/div>\n\n  <div class=\"price-table-wrap\" style=\"margin-top:24px\">\n    <table class=\"price-table\">\n      <caption>Цена и длительность первичного приёма уточняются [?]<\/caption>\n      <thead><tr><th>Место<\/th><th>Длительность<\/th><th>Цена<\/th><th><\/th><\/tr><\/thead>\n      <tbody>\n        <tr><td><span class=\"loc-tag loc-tag--lesnoe\">Пригород Лесное<\/span><\/td><td>уточняется [?]<\/td><td class=\"price unknown\">уточняется [?]<\/td><td><a class=\"btn btn-secondary\" href=\"#p:design/directions/c/pages/booking/index.html?svc=first&fam=first&loc=lesnoe\">Записаться<\/a><\/td><\/tr>\n        <tr><td><span class=\"loc-tag loc-tag--moskva\">Москва<\/span><\/td><td>уточняется [?]<\/td><td class=\"price unknown\">уточняется [?]<\/td><td><a class=\"btn btn-secondary\" href=\"#p:design/directions/c/pages/booking/index.html?svc=first&fam=first&loc=moskva\">Записаться<\/a><\/td><\/tr>\n        <tr><td><span class=\"loc-tag loc-tag--online\">Онлайн<\/span><\/td><td>уточняется [?]<\/td><td class=\"price unknown\">уточняется [?]<\/td><td><a class=\"btn btn-secondary\" href=\"#p:design/directions/c/pages/booking/index.html?svc=first&fam=first&loc=online\">Записаться<\/a><\/td><\/tr>\n      <\/tbody>\n    <\/table>\n  <\/div>\n  <p class=\"small muted\" style=\"margin-top:16px\">Услуги не являются медицинскими. При наличии заболеваний и противопоказаний проконсультируйтесь с врачом.<\/p>\n<\/section>\n<\/main><footer class=\"site-
