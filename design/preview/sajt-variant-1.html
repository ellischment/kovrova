mary>Когда открывается запись на новый месяц?<\/summary><div class=\"accordion__body\">Дата и время открытия задаются в кабинете Ирины и могут меняться месяц от месяца — актуальный статус смотрите на странице «Расписание».<\/div><\/details><details><summary>Можно ли поменять технику массажа?<\/summary><div class=\"accordion__body\">Да, до 18:00 накануне визита (значение по умолчанию, уточняется у Ирины).<\/div><\/details><details><summary>Что с предоплатой при отмене?<\/summary><div class=\"accordion__body\">Правила отмены и возврата предоплаты уточняются [?] — по умолчанию бесплатная отмена за 48&nbsp;часов, при более поздней отмене предоплата удерживается, но возвращается, если окно выкупили из листа ожидания.<\/div><\/details><details><summary>Это медицинская услуга?<\/summary><div class=\"accordion__body\">Нет. Услуги не являются медицинскими. При наличии заболеваний и противопоказаний проконсультируйтесь с врачом.<\/div><\/details><details><summary>Можно ли позвонить во время сеанса?<\/summary><div class=\"accordion__body\">Во время сеансов Ирина не берёт трубку — быстрее написать в Telegram.<\/div><\/details>\n  <\/div>\n<\/section>\n<\/main><footer class=\"site-footer\">\n  <div class=\"container\">\n    <div class=\"site-footer__grid\">\n      <div>\n        <h4>Места<\/h4>\n        <ul>\n          <li><a href=\"#p:design/directions/c/pages/lesnoe.html\">Пригород Лесное (ПЛ)<\/a><\/li>\n          <li><a href=\"#p:design/directions/c/pages/moskva.html\">Москва · м. Таганская<\/a><\/li>\n          <li><a href=\"#p:design/directions/c/pages/online.html\">Онлайн<\/a><\/li>\n        <\/ul>\n      <\/div>\n      <div>\n        <h4>Сайт<\/h4>\n        <ul>\n          <li><a href=\"#p:design/directions/c/pages/uslugi.html\">Услуги и цены<\/a><\/li>\n          <li><a href=\"#p:design/directions/c/pages/raspisanie.html\">Расписание<\/a><\/li>\n          <li><a href=\"#p:design/directions/c/pages/otzyvy.html\">Слова гостей<\/a><\/li>\n          <li><a href=\"#p:design/ я рук.\">\n<link rel=\"icon\" href=\"data:,\">\n<link rel=\"preload\" href=\"{{a:design/directions/c/fonts/geologica-cyrillic-wght-normal.woff2}}\" as=\"font\" type=\"font/woff2\" crossorigin=\"anonymous\">\n<link rel=\"stylesheet\" href=\"{{a:design/directions/c/base.css}}\">\n<\/head>\n<body data-slug=\"zametki.html\">\n<a class=\"skip-link\" href=\"#main\">Перейти к содержанию<\/a>\n<header class=\"site-header\">\n  <div class=\"container site-header__row\">\n    <a class=\"site-header__brand\" href=\"#p:design/directions/c/pages/index.html\">Ирина Коврова <span class=\"hand\">· практика<\/span><\/a>\n    <nav aria-label=\"Основная навигация\">\n      <ul class=\"site-header__nav\"><li><a href=\"#p:design/directions/c/pages/uslugi.html\">Услуги и цены<\/a><\/li><li><a href=\"#p:design/directions/c/pages/raspisanie.html\">Расписание<\/a><\/li><li><a href=\"#p:design/directions/c/pages/ob-irine.html\">Об Ирине<\/a><\/li><li><a href=\"#p:design/directions/c/pages/zametki.html\" aria-current=\"page\">Заметки<\/a><\/li><li><a href=\"#p:design/directions/c/pages/sobytiya.html\">События<\/a><\/li><li><a href=\"#p:design/directions/c/pages/voprosy.html\">Вопросы<\/a><\/li><li><a href=\"#p:design/directions/c/pages/kontakty.html\">Контакты<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"site-header__actions\">\n      <a class=\"btn btn-primary\" href=\"#p:design/directions/c/pages/booking/index.html\">Записаться<\/a>\n      <button class=\"nav-toggle\" aria-expanded=\"false\" aria-controls=\"site-nav-panel\" id=\"nav-toggle\" aria-label=\"Меню\">\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2 5h16M2 10h16M2 15h16\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><\/svg>\n      <\/button>\n    <\/div>\n  <\/div>\n  <div class=\"site-nav-panel\" id=\"site-nav-panel\">\n    <div class=\"container\">\n      <ul><li><a href=\"#p:design/directions/c/pages/uslugi.html\">Услуги и цены<\/a><\/li><li><a href=\"#p:design/directions/c/pages/raspisanie.html\">Расписание<\/a><\/li><li><a href=\"#p:design/directions/c/pages/ob-irine.html\">Об Ирине<\/a><\/li><li><a href=\"#p:design/directions/c/pages/zametki.html\" aria-current=\"page\">Заметки<\/a><\/li><li><a href=\"#p:design/directions/c/pages/sobytiya.html\">События<\/a><\/li><li><a href=\"#p:design/directions/c/pages/voprosy.html\">Вопросы<\/a><\/li><li><a href=\"#p:design/directions/c/pages/kontakty.html\">Контакты<\/a><\/li><li><a href=\"#p:design/directions/c/pages/booking/index.html\">Записаться<\/a><\/li><\/ul>\n    <\/div>\n  <\/div>\n<\/header>\n<main id=\"main\">\n<article class=\"section container sheet sheet-prose\">\n  <p><a class=\"btn-text\" href=\"#p:design/directions/c/pages/zametki.html\">← Все заметки<\/a><\/p>\n  <h1>Почему иногда достаточно поработать с руками?<\/h1>\n  <p class=\"muted\">Из телеграм-канала Ирины<\/p>\n  <p>Порой, чтобы обратить внимание на весь организм, совсем не обязательно работать с ним целиком. Есть направления телесной работы, где используются представительные зоны — участки тела, которым сопоставляют другие его области (радужка глаза, язык, ухо, лицо, стопы, кисти и ладони).<\/p>\n  <p>Сегодня предлагаю посмотреть на кисти рук. Они накапливают много напряжения в течение дня. В корейской системе су-джок кисть и пальцы рассматриваются как система соответствий.<\/p>\n  <h2>Маленькая практика<\/h2>\n  <p>Мягко разомните большой палец от основания к кончику, пройдитесь по его боковым поверхностям. Без боли. Без сильного давления. Скорее с любопытством и вниманием к своим ощущениям.<\/p>\n  <p>Такая практика не отменяет необходимых медицинских мер.<\/p>\n  <p>А ведь руки могут быть ещё и способом вернуться к себе. Почувствовать тепло ладоней. Замечать напряжение в пальцах. Мягко прикоснуться к себе. И хотя бы на несколько минут остановиться.<\/p>\n  <p>Берегите себя — и не проходите мимо маленьких сигналов вашего тела. 🍀<\/p>\n<\/article>\n<\/main><footer class=\"site-f
